<section>
    <h2 mat-dialog-title>{{data.title}}</h2>

    <mat-dialog-content>
        <p>
            <strong>{{data.message}}</strong> ?
        </p>
    </mat-dialog-content>
    <br>

    <mat-dialog-actions align="end">
        <button mat-button (click)="cancel()"> Cancel</button>
        <button mat-raised-button color="warn" (click)="confirm()">{{data.isdeleteBtn}}</button>
    </mat-dialog-actions>
</section>
